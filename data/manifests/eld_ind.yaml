dataset_id: eld_ind
name: ElectricityLoadDiagrams20112014 (UCI)
source_url: https://archive.ics.uci.edu/dataset/321/electricityloaddiagrams20112014
download_url: https://archive.ics.uci.edu/static/public/321/electricityloaddiagrams20112014.zip
downloaded_at: "2026-08-06"
timestep: 900 s       # 15分钟
category: ind         # 370个中压变压器(MT)客户，工业/商业负荷
description: >
  葡萄牙370个中压客户2011-2014年的用电负荷，15分钟采样，共140256行。
  每列代表一个客户(MT_001..MT_370)，值为kW（转kWh需除以4）。
  部分客户2011年后才接入，此前记为0。全年每天96个点(24*4)。
  3月/10月夏令时切换日的1:00-2:00值存在归零或聚合现象。
features:
  - {raw: "datetime", unit: "yyyy-mm-dd hh:mm:ss"}
  - {raw: "MT_001..MT_370", unit: "kW"}
