# eld_ind 清洗方案与质量报告

meta:
  dataset_id: eld_ind
  submitted_by: "xxx（数据收集/特征筛选负责人）"
  reviewer: null
  date: "2026-08-08"
  script: scripts/clean_eld_ind.py

# ---- 清洗前：数据特征分析与方案 ----
data_profile:
  native_timestep: 900          # 15分钟
  uniform: true
  unit_power: "kW"
  timestamp_format: "yyyy-mm-dd hh:mm:ss"
  missing_format: "0 (接入前为0填充)"
  negative_semantics: "无"
  sequence_semantics: "葡萄牙370个中压变压器(MT_001~MT_370)客户负荷"

cleaning_plan:
  target_timestep: 1800         # 统一30min（从15min均值重采样）
  resample_method: "mean"
  missing:
    method: "linear_interp"
    max_gap: 6
  outlier:
    physical_bounds: [0, 10000]  # kW
    statistical: "MAD_Z"
    temporal: "diff_outlier"
  features:
    # ==== 特征筛选结果（§6，2026-08-08） ====
    # 本数据集无原生非功率列，本地特征维度=0（§5.2.1）
    # 370个客户列(MT_001~MT_370)全部为目标负荷，客户端划分在建模阶段按10列/组切分
    # 无辅助特征可筛，XGBoost+SHAP 不适用（列即目标）
    drop_columns: []
    retain_columns: ["MT_001"~"MT_370"]  # 370个客户列全保留
    retain_public: ["hour_sin","hour_cos","dow_sin","dow_cos","is_weekend","month_sin","month_cos","category_id"]  # 公共特征
  plan_reviewed: false

# ---- 清洗后：质量指标 ----
quality_metrics:
  missing_rate: 0.0             # 清洗后370列缺失率均为0
  max_gap_steps: 0
  outlier_ratio: 0.008
  value_range_after: [0.0, 8750.0]   # kW
  residual_risks: "客户2011年接入前为0填充，非真实负荷；夏令时切换日1:00-2:00值异常（原始数据特性），保留均值结果"
