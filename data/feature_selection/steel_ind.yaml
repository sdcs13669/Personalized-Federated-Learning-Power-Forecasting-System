# steel_ind 清洗方案与质量报告
meta:
  dataset_id: steel_ind
  submitted_by: bi_minghao
  reviewer: null
  date: "2026-08-08"
  script: scripts/clean_steel_ind.py

# ---- 清洗前：数据特征分析与方案 ----
data_profile:
  native_timestep: 900          # 15分钟
  uniform: true                  # 全年96点/天，采样均匀
  unit_power: "kWh"
  timestamp_format: "dd/mm/yyyy hh:mm"
  missing_format: "无缺失"
  negative_semantics: "无"
  sequence_semantics: "钢厂单厂负荷"

cleaning_plan:
  target_timestep: 1800          # 统一30min
  resample_method: "mean"
  missing:
    method: "linear_interp"
    max_gap: 6
  outlier:
    physical_bounds: [0, 1000000]
    statistical: "MAD_Z"
    temporal: "diff_outlier"
  features:
    # ==== 特征筛选结果（§6，2026-08-08） ====
    # 统计筛选：leading_reactive_power<->leading_pf 相关系数-0.950，
    #          lagging_reactive_power<->co2 相关系数0.900，均高度冗余；
    #          VIF：leading_reactive_power=11.39, leading_pf=13.03, co2=11.52 均>10
    # 模型筛选：XGBoost+SHAP 中 co2 贡献最高(importance 0.625)，leading_pf次之
    drop_columns:
      - "date"                       # 时间戳，已派生时间特征
      - "NSM"                        # 距午夜秒数，被公共时间特征覆盖
      - "WeekStatus"                 # 周末/工作日，被is_weekend覆盖
      - "Day_of_week"                # 星期几，被dow_sin/cos覆盖
      - "leading_reactive_power"     # 与leading_pf高度冗余(r=-0.950)，VIF>10，剔除
      - "lagging_pf"                 # 与lagging_reactive_power冗余，SHAP贡献低
    retain_columns:
      - "Usage_kWh"                  # 目标负荷列（保留）
      - "lagging_reactive_power"     # 本地特征，与co2冗余但SHAP有贡献
      - "co2"                        # 本地特征，XGBoost重要性最高
      - "leading_pf"                 # 本地特征，SHAP贡献次高
      - "load_type"                  # 本地特征，类别特征(3档负荷)
  plan_reviewed: false

# ---- 清洗后：质量指标 ----
quality_metrics:
  missing_rate: 0.0638           # 6.4%，大缺口段保留NaN
  max_gap_steps: 6
  outlier_ratio: 0.008
  value_range_after: [1.765, 31.59]
  residual_risks: "2018-12-31夜间边界重采样产生少量NaN；Load_Type类别缺失映射为-1；本地特征从6维精简至4维（剔除2个冗余/低贡献列）"
