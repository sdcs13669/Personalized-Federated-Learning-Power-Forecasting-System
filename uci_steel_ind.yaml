dataset_id: uci_steel_ind
name: Steel Industry Energy Consumption
source_url: https://archive.ics.uci.edu/dataset/851/steel+industry+energy+consumption
timestep: 900 s       # 原生采样间隔 15 分钟
category: ind                    # ind（工业 industrial）
description: >
  韩国光阳 DAEWOO（大宇）钢铁公司钢铁厂的电力能耗记录，原始采集数据，
  覆盖 2018 全年（35040 条），15 分钟分辨率。数据来自韩国电力公司（KEPCO）
  的能源管理云平台，由 UCI Machine Learning Repository 公开托管，
  CC BY 4.0 许可，DOI: 10.24432/C52G8C。
  每条记录含有功电耗（Usage_kWh）、无功功率、功率因数、CO2 等 9 个特征。
features:
  - {raw: "date",                             unit: "iso" }       # 时间戳（2018 全年，15 分钟间隔）
  - {raw: "Usage_kWh",                        unit: "kwh" }       # 钢铁厂有功电耗，kWh/15min
  - {raw: "Lagging_Current_Reactive.Power_kVarh", unit: "kvarh" } # 滞后电流无功功率
  - {raw: "Leading_Current_Reactive_Power_kVarh",  unit: "kvarh" } # 超前电流无功功率
  - {raw: "CO2(tCO2)",                        unit: "ppm" }       # CO2 排放
  - {raw: "Lagging_Current_Power_Factor",     unit: "%" }         # 滞后功率因数
  - {raw: "Leading_Current_Power_Factor",     unit: "%" }         # 超前功率因数
  - {raw: "NSM",                              unit: "s" }         # 当日零点起的秒数
  - {raw: "WeekStatus",                       unit: "code" }      # 工作日(1)/周末(0)
  - {raw: "Day_of_week",                      unit: "code" }      # 星期几
