# ============================================================
# 两阶段联邦 TCN 配置  v2.1
# 严格按 Bai et al. (2018) locuslab/TCN 实现
# ============================================================

global:
  time_step_minutes: 30
  input_window_steps: 144     # 3天 × 48步/天
  output_window_steps: 6      # 3小时 × 2步/小时

# ============================================================
# 阶段一: Global TCN — FedAvg 聚合，输出点预测 Y_pre
# ============================================================
global_model:
  name: "TCN"
  in_channels: 11             # 10 公共特征（7 时间 + 3 one-hot 类别）+ 1 历史负荷
  input_steps: 144
  pred_len: 6
  num_channels:               # 7 层 64 通道，rf=255 >= 144
    - 64  # dil=1
    - 64  # dil=2
    - 64  # dil=4
    - 64  # dil=8
    - 64  # dil=16
    - 64  # dil=32
    - 64  # dil=64
  kernel_size: 2
  dropout: 0.2
  head_hidden: 32
  output_head: "last_step → FFN(64→32→6) + LeakyReLU"

# ============================================================
# 阶段二: Residual Corrector — 本地个性修正（永不上传）
# ============================================================
corrector:
  rc_type: "mlp"              # "mlp" 默认（最简单、训练快，作强 baseline）| "lstm" | "tcn"

  # --- shared settings ---
  pred_len: 6
  local_feat_dim: 0           # 由 dataset 决定 (eld=0, lcl=1, tetouan=5, steel=4)
  quantiles: [0.1, 0.5, 0.9]
  dropout: 0.1

  # --- window context（三种 RC 共用）---
  window_in_channels: 11      # Global TCN 输入通道（10 公共 + 1 负荷）
  window_ctx_dim: 512         # 窗口编码上下文向量维度（可配置，默认 512）
                              # 窗口通道 = window_in_channels + local_feat_dim

  # --- MLP (rc_type=mlp) ---
  hidden_dims: [512, 256, 128, 64, 32]   # 2+ctx → 512 → ... → 32 → 3，LeakyReLU

  # --- LSTM/TCN 共享 FFN ---
  ffn_hidden: [256, 128]      # 逐步输入压缩 FFN: [2+ctx, 256, 128]，LeakyReLU
  head_hidden: 32             # 输出 FFN: [seq_out, 32, 3]，LeakyReLU

  # --- LSTM (rc_type=lstm) ---
  hidden_size: 128            # LSTM 隐层（= 输出 FFN 输入维）
  num_layers: 1

  # --- TCN (rc_type=tcn) ---
  num_channels:               # 4 层 128 通道，rf=31 >= 6（= 输出 FFN 输入维）
    - 128  # dil=1
    - 128  # dil=2
    - 128  # dil=4
    - 128  # dil=8
  kernel_size: 2

  input:
    - y_pre              [6, 1]      # 全局模型点预测
    - window_context     [6, 512]    # x_window(11+D_local, 144) → 卷积编码 → 广播
    - residual_history   [6, 1]      # 上一次预测的残差
  output:
    shape: [Batch, 6, 3]
    name: "E_corr"

# ============================================================
# 最终输出与损失
# ============================================================
prediction:
  Y_final: "Y_pre + E_corr  →  [Batch, 6, 3]"

loss:
  stage1: "MAE"
  stage2: "Pinball / Quantile Loss"
