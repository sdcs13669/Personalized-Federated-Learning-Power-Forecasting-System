# household_res 清洗方案与质量报告
meta:
  dataset_id: household_res
  submitted_by: bi_minghao
  reviewer: null
  date: "2026-08-08"
  script: scripts/clean_household_res.py

# ---- 清洗前：数据特征分析与方案 ----
data_profile:
  native_timestep: 60           # 1分钟
  uniform: true
  unit_power: "kW"
  timestamp_format: "dd/mm/yyyy hh:mm:ss"
  missing_format: "'?' 占位符"
  negative_semantics: "无"
  sequence_semantics: "单户家庭"

cleaning_plan:
  target_timestep: 1800         # 统一30min
  resample_method: "mean"
  missing:
    method: "linear_interp"
    max_gap: 6
  outlier:
    physical_bounds: [0, 50]    # kW
    statistical: "MAD_Z"
    temporal: "diff_outlier"
  features:
    # ==== 特征筛选结果（§6，2026-08-08） ====
    # 模型筛选：XGBoost+SHAP 中 hour_cos(0.367)、month_cos(0.315)、hour_sin(0.175) 贡献最大
    drop_columns:
      - "Date"                       # 时间戳，已派生时间特征
      - "Time"                       # 时间戳，已派生时间特征
      - "Global_reactive_power"      # 清洗阶段未保留为本地特征（规范§5.2未定义）
      - "Voltage"                    # 清洗阶段未保留为本地特征
      - "Global_intensity"           # 清洗阶段已丢弃；该列与目标r=0.999冗余（清洗前探查发现），不应作特征
      - "Sub_metering_1"             # 清洗阶段未保留
      - "Sub_metering_2"             # 清洗阶段未保留
      - "Sub_metering_3"             # 清洗阶段未保留
    retain_columns:
      - "Global_active_power"        # 目标负荷列（保留）
      - "hour_sin"                   # 公共特征，encoder输入
      - "hour_cos"                   # 公共特征，encoder输入（SHAP贡献最高）
      - "dow_sin"                    # 公共特征，encoder输入
      - "dow_cos"                    # 公共特征，encoder输入
      - "is_weekend"                 # 公共特征，encoder输入
      - "month_sin"                  # 公共特征，encoder输入
      - "month_cos"                  # 公共特征，encoder输入（SHAP贡献次高）
      - "category_id"                # 公共特征：类别编码（0=居民），保留
  plan_reviewed: false

# ---- 清洗后：质量指标 ----
quality_metrics:
  missing_rate: 0.0110          # 1.1%，原始'?'缺失+重采样
  max_gap_steps: 6
  outlier_ratio: 0.002
  value_range_after: [0.0881, 7.5291]
  residual_risks: "原始25979条'?'记录按缺失处理；本地特征维度=0(规范§5.2未定义)；category_id本数据集内为常量(居民类)但属公共特征保留"
