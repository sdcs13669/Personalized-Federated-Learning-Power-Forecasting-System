# ---- 4. 筛选建议 ----
recommendations:
  drop:
    - feature: leading_reactive_power
      shap: 0.237
      shap_pct: "<1%"
      reason: "SHAP贡献极低（0.24），与leading_pf高度冗余（r=-0.950）。容性补偿的功率因数已足够表征无功状态，超前无功功率本身无额外预测价值。"
      action: "从本地特征中剔除。清洗后csv中可移除该列，残差修正器 D_dynamic 不再包含。"
    - feature: leading_pf
      shap: 0.212
      shap_pct: "<1%"
      reason: "SHAP贡献极低（0.21），超前功率因数对钢厂负荷预测帮助甚微。钢厂负荷主要由感性负载（滞后）决定，容性补偿侧信息不重要。"
      action: "从本地特征中剔除。清洗后csv中可移除该列。"
    - feature: category_id
      shap: 0.000
      reason: "本数据集内为常量（全为2），SHAP贡献=0。但联邦跨数据集时必须保留，此处仅标记。"
      action: "单数据集分析标记drop，联邦训练时恢复为encoder输入。"
  retain:
    - feature: co2
      shap: 11.256
      type: "本地特征"
      reason: "SHAP贡献最高（11.26）。CO2排放与钢厂产能直接正相关，是预测用电负荷的最强单变量代理。本地特征，进入残差修正器。"
