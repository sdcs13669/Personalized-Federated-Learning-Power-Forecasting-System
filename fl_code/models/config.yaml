# ============================================================
# 两阶段联邦 TCN 配置  v2.1
# 严格按 Bai et al. (2018) locuslab/TCN 实现
# ============================================================

global:
  time_step_minutes: 30
  input_window_steps: 144     # 3天 × 48步/天
  output_window_steps: 6      # 3小时 × 2步/小时

# ============================================================
# 阶段一: Global TCN — FedAvg 聚合，输出点预测 Y_pre
# ============================================================
global_model:
  name: "TCN"
  in_channels: 11             # 10 公共特征（7 时间 + 3 one-hot 类别）+ 1 历史负荷
  input_steps: 144
  pred_len: 6
  num_channels:               # 7 层，rf=255 >= 144
    - 32  # dil=1
    - 32  # dil=2
    - 32  # dil=4
    - 32  # dil=8
    - 32  # dil=16
    - 32  # dil=32
    - 32  # dil=64
  kernel_size: 2
  dropout: 0.2
  output_head: "last_step → Linear(32, 6)"

# ============================================================
# 阶段二: Residual Corrector — 本地个性修正（永不上传）
# ============================================================
corrector:
  rc_type: "mlp"              # "mlp" 默认（DP 唯一兼容架构，Phase 3/4 对照同架构）| "lstm" | "tcn"

  # --- shared settings ---
  pred_len: 6
  local_feat_dim: 0           # 由 dataset 决定 (eld=0, lcl=1, tetouan=5, steel=4)
  quantiles: [0.1, 0.5, 0.9]
  dropout: 0.1

  # --- MLP (rc_type=mlp) ---
  hidden_dims: [64, 32]       # MLP 隐藏层: 2+D_local → 64 → 32 → 3

  # --- TCN (rc_type=tcn) ---
  num_channels:               # 4 层 + 自动追加 3，rf=31 >= 6
    - 16  # dil=1
    - 16  # dil=2
    - 16  # dil=4
    - 16  # dil=8
  kernel_size: 2

  input:
    - Y_pre              [6, 1]   # 全局模型点预测
    - residual_history   [6, 1]   # 上一次预测的残差
    - x_local_dynamic    [6, D]   # 本地动态特征（可选）
  output:
    shape: [Batch, 6, 3]
    name: "E_corr"

# ============================================================
# 最终输出与损失
# ============================================================
prediction:
  Y_final: "Y_pre + E_corr  →  [Batch, 6, 3]"

loss:
  stage1: "MAE"
  stage2: "Pinball / Quantile Loss"
