dataset_id: refit_res
name: REFIT Electrical Load Measurements (Cleaned)
source_url: https://zenodo.org/records/5063428
license:
  name: Creative Commons Attribution 4.0 International (CC BY 4.0)
  url: https://creativecommons.org/licenses/by/4.0/
timestep: 8 s             # 原生采样间隔 8 秒
category: res             # 居民负荷
description: >
  REFIT 项目(英国拉夫堡大学)清洁版家庭用电数据集。
  20 户英国家庭的聚合与设备级电力消耗,单位为瓦特,
  8 秒采样间隔,含 2013-2015 年两年纵向数据。经 Zenodo
  存档,DOI: 10.5281/zenodo.5063428。可用于非侵入式
  负荷监测、需求响应、能耗分析等研究。
features:
  - {raw: "Time", unit: "timestamp"}       # 时间戳
  - {raw: "Aggregate", unit: "watts"}      # 聚合功率
  - {raw: "Appliance1..9", unit: "watts"}  # 设备级功率
records: 20 households
format: csv / xlsx
doi: "10.5281/zenodo.5063428"
