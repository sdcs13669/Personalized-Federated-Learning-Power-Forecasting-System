steel_ind:
  public_features: &id001
  - hour_sin
  - hour_cos
  - dow_sin
  - dow_cos
  - is_weekend
  - month_sin
  - month_cos
  - cat_residential
  - cat_transformer
  - cat_industrial
  local_features:
  - co2
  - lagging_reactive_power
  - lagging_pf
  - load_type
  clients:
    steel_ind_0:
      description: steel_ind full dataset (365 days)
      sequences:
      - Usage_kWh
tetouan_city:
  public_features: *id001
  local_features:
  - temperature
  - humidity
  - wind_speed
  - general_diffuse_flow
  - diffuse_flow
  clients:
    tetouan_city_0:
      description: tetouan_city Zone1 (industrial) (364 days)
      sequences:
      - load_zone1
    tetouan_city_1:
      description: tetouan_city Zone2 (mixed) (364 days)
      sequences:
      - load_zone2
    tetouan_city_2:
      description: tetouan_city Zone3 (residential) (364 days)
      sequences:
      - load_zone3
lcl_res:
  public_features: *id001
  local_features: []
  clients:
    lcl_res_0:
      description: lcl_res early enrollment (<2012), 6 communities (adjacent 30-household sums)
      sequences:
      - comm_000
      - comm_001
      - comm_002
      - comm_003
      - comm_004
      - comm_005
    lcl_res_1:
      description: lcl_res late enrollment (>=2012), 5 communities (adjacent 30-household sums)
      sequences:
      - comm_100
      - comm_101
      - comm_102
      - comm_103
      - comm_104
