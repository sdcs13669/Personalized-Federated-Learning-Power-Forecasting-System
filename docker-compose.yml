version: "3.8"

services:
  fl-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
      - "8089:8089"
    volumes:
      - fl-data:/app/data
    environment:
      - FL_SERVER_HOST=0.0.0.0
      - FL_GRPC_PORT=8089
      - FL_REST_PORT=8000
      - JWT_SECRET=change-me-in-production
      - DB_PATH=/app/data/fl_server.db
    restart: unless-stopped

volumes:
  fl-data:
